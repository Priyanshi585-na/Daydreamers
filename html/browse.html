<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse the Shelf | Daydreamers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-book-open"></i>
      <span>Daydreamers.</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="./browse.html" class="active">Browse</a>
      <a href="./mylistings.html">My Listings</a>
      <a href="./about.html">About</a>
    </nav>

    <button class="list-book-btn" id="list-book-btn">
      List a Book
    </button>
  </header>

  <section class="page-header">
    <div class="wrap">
      <span class="eyebrow">Browse</span>
      <h1>The Shelf</h1>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by title, genre, author...">
        <button id="search-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="browse-layout">

      <aside class="filters">
        <div class="filter-group">
          <h4>Genre</h4>
          <label class="filter-option"><input type="checkbox" class="genre-filter" value="textbooks">
            Textbooks</label>
          <label class="filter-option"><input type="checkbox" class="genre-filter" value="fiction"> Novels &amp;
            Fiction</label>
          <label class="filter-option"><input type="checkbox" class="genre-filter" value="poetry"> Poetry &amp;
            Plays</label>
          <label class="filter-option"><input type="checkbox" class="genre-filter" value="science">
            Sci-Fi &amp; Fantasy</label>
          <label class="filter-option"><input type="checkbox" class="genre-filter" value="nonfiction">
            Non-Fiction</label>
        </div>

        <div class="filter-group">
          <h4>Condition</h4>
          <label class="filter-option"><input type="checkbox" class="condition-filter" value="Like new"> Like
            new</label>
          <label class="filter-option"><input type="checkbox" class="condition-filter" value="Good condition">
            Good</label>
          <label class="filter-option"><input type="checkbox" class="condition-filter" value="Well-loved">
            Well-loved</label>
        </div>

        <div class="filter-group">
          <h4>Price</h4>
          <label class="filter-option"><input type="checkbox" class="price-filter" value="Free"> Free</label>
          <label class="filter-option"><input type="checkbox" class="price-filter" value="Under ₹200"> Under
            ₹200</label>
        </div>

        <div class="filter-group">
          <h4>Status</h4>
          <label class="filter-option"><input type="checkbox" class="type-filter" value="Lend"> Lend</label>
          <label class="filter-option"><input type="checkbox" class="type-filter" value="Sell"> Sell</label>
          <label class="filter-option"><input type="checkbox" class="type-filter" value="Borrow"> Borrow</label>
        </div>

        <span class="clear-filters" id="clear-filters">Clear all filters</span>
      </aside>

      <div class="results">
        <div class="results-bar">
          <span class="resultsCount" id="resultsCount">Loading shelf...</span>
        </div>


        <div class="gridContainer" id="gridContainer">

        </div>

        <div class="pagination" id="pagination">

        </div>
      </div>
    </div>
  </div>





  <div class="modal-overlay" id="list-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2>List a Book on Campus</h2>

      <div id="modal-step-1">
        <p class="modal-subtitle">Step 1: Search and select the book</p>
        <div class="modal-search-box">
          <input type="text" id="modal-search-input" placeholder="Type title or author (e.g. Clean Code)">
          <button type="button" id="modal-search-btn">Search</button>
        </div>
        <div id="modal-search-results" class="modal-results-list"></div>
      </div>

      <form id="modal-step-2" style="display: none;">
        <p class="modal-subtitle">Step 2: Add listing details</p>
        <div class="selected-book-preview" id="selected-preview"></div>

        <div class="form-grid">
          <div class="form-group">
            <label for="lister-name">Your Name</label>
            <input type="text" id="lister-name" required placeholder="e.g. Rohan">
          </div>

          <div class="form-group">
            <label for="lister-year">College Year</label>
            <select id="lister-year" required>
              <option value="1st yr">1st Year</option>
              <option value="2nd yr">2nd Year</option>
              <option value="3rd yr">3rd Year</option>
              <option value="4th yr">4th Year</option>
            </select>
          </div>

          <div class="form-group">
            <label for="listing-genre">Genre / Category</label>
            <select id="listing-genre" required>
              <option value="fiction" selected>Novels &amp; Fiction</option>
              <option value="textbooks">Textbooks &amp; Coursework</option>
              <option value="science">Science &amp; Tech</option>
              <option value="poetry">Poetry &amp; Plays</option>
            </select>
          </div>

          <div class="form-group">
            <label for="listing-type">Listing Type</label>
            <select id="listing-type" required>
              <option value="Lend">Lend (Free)</option>
              <option value="Sell">Sell</option>
              <option value="Borrow">Request to Borrow</option>
            </select>
          </div>

          <div class="form-group">
            <label for="listing-price">Price</label>
            <input type="text" id="listing-price" required value="Free">
          </div>

          <div class="form-group">
            <label for="listing-condition">Condition</label>
            <select id="listing-condition" required>
              <option value="Like new">Like new</option>
              <option value="Good condition" selected>Good condition</option>
              <option value="Well-loved">Well-loved</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="lister-phone">WhatsApp Phone Number</label>
            <input type="tel" id="lister-phone" required placeholder="e.g. 919876543210">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-back">← Pick Different Book</button>
          <button type="submit" class="btn-primary">Publish Listing</button>
        </div>
      </form>
    </div>
  </div>





  <footer>
    <h3>Daydreamers</h3>
    <p>A cozy place where books find new homes.</p>
    <p>© 2026 Daydreamers</p>
  </footer>

  <script type="module" src="../js/browse.js"></script>
  <script type="module" src="../js/listing-modal.js"></script>
</body>

</html>
