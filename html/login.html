<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Daydreamers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page-body">

    <header>
        <div class="logo">
            <a href="index.html"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-book-open"></i>
                <span>Daydreamers.</span>
            </a>
        </div>
        <div>
            <a href="signup.html" class="list-book-btn" style="text-decoration: none;">Sign Up</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to access your campus library and trade books.</p>
            </div>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="login-email">Campus Email</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="student@university.edu">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="login-password">Password</label>
                    </div>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="list-book-btn auth-submit-btn">
                    Log In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Join Daydreamers</a></p>
            </div>
        </div>
    </main>

    <footer>
        <h3>Daydreamers</h3>
        <p>A cozy place where books find new homes.</p>
        <p>© 2026 Daydreamers</p>
    </footer>

</body>

</html>
